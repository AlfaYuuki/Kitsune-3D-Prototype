name: Build Blender NPC assets

on:
  push:
    branches: [main]
    paths:
      - "tools/blender/generate_kitsune_npcs.py"
      - ".github/workflows/build-blender-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate editable Blender scenes and game exports
        run: blender --background --python tools/blender/generate_kitsune_npcs.py
      - name: Commit generated .blend and .glb assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/*.blend assets/characters/*.glb
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "Generate editable Blender NPC scenes and GLB exports"
            git push
          fi
