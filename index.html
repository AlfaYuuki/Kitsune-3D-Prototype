<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kitsune FunZone — 3D Prototype</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #071426; color: white;
      touch-action: none;
    }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px;
      padding: 12px 15px; border-radius: 14px;
      background: #071426cc; border: 1px solid #53c9ff66;
      pointer-events: none; font-size: 13px;
    }
    #hud strong { color: #65d9ff; font-size: 16px; }
    #hint {
      position: fixed; top: 12px; right: 12px;
      max-width: 45%; text-align: right;
      font-size: 11px; color: #e0efff;
      text-shadow: 0 2px 5px #000;
      pointer-events: none;
    }
    #stick {
      position: fixed; bottom: 25px; left: 25px;
      width: 120px; height: 120px; border-radius: 50%;
      background: #bcecff22; border: 2px solid #a8e6ff88;
      touch-action: none;
    }
    #knob {
      position: absolute; left: 35px; top: 35px;
      width: 46px; height: 46px; border-radius: 50%;
      background: #65d9ffcc; border: 2px solid white;
    }
    #attack {
      position: fixed; right: 25px; bottom: 35px;
      width: 78px; height: 78px; border-radius: 50%;
      color: white; font-weight: bold; font-size: 15px;
      background: #185dbb; border: 2px solid #83e5ff;
      box-shadow: 0 0 20px #167dff66;
      touch-action: none;
    }
    #message {
      position: fixed; top: 42%; width: 100%;
      text-align: center; font-size: 28px; font-weight: 800;
      color: #a6ecff; text-shadow: 0 0 18px #167dff;
      opacity: 0; pointer-events: none;
    }
    @media (pointer:fine) {
      #stick::after {
        content: "WASD / ARROWS";
        position: absolute; top: 124px; left: 5px;
        white-space: nowrap; font-size: 10px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>

<body>
  <div id="hud">
    <strong>🦊 KITSUNE FUNZONE</strong><br>
    3D World Prototype<br>
    Level 1 · Rank D<br>
    <span id="coords">Position: 0, 0</span>
  </div>

  <div id="hint">Drag the right side to look around<br>Explore the world!</div>
  <div id="stick"><div id="knob"></div></div>
  <button id="attack">⚔️<br>ATTACK</button>
  <div id="message">⚔️ SWORD SKILL!</div>

  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x83cfff);
    scene.fog = new THREE.Fog(0x83cfff, 35, 110);

    const camera = new THREE.PerspectiveCamera(
      65, innerWidth / innerHeight, 0.1, 180
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: false, powerPreference: "low-power"
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = false;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xd7efff, 0x34522e, 2));

    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(-12, 24, 10);
    scene.add(sun);

    function material(color) {
      return new THREE.MeshStandardMaterial({
        color, roughness: 1, metalness: 0
      });
    }

    const grassMat = material(0x4b9b60);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 180), grassMat
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    scene.add(ground);

    // A pale path through the starter area
    const path = new THREE.Mesh(
      new THREE.PlaneGeometry(7, 100),
      material(0xcbb991)
    );
    path.rotation.x = -Math.PI / 2;
    path.position.set(0, 0, -12);
    scene.add(path);
    
const obstacles = [];
const PLAYER_RADIUS = 0.42;

function canStandAt(x, z) {
  // Keep the player inside the starter area.
  if (x < -44.5 || x > 44.5 || z < -84.5 || z > 24.5) {
    return false;
  }

  for (const obstacle of obstacles) {
    if (obstacle.type === "circle") {
      const dx = x - obstacle.x;
      const dz = z - obstacle.z;
      const minDistance = PLAYER_RADIUS + obstacle.r;

      if (dx * dx + dz * dz < minDistance * minDistance) {
        return false;
      }
    }

    if (obstacle.type === "box") {
      const insideX =
        Math.abs(x - obstacle.x) < obstacle.sx / 2 + PLAYER_RADIUS;
      const insideZ =
        Math.abs(z - obstacle.z) < obstacle.sz / 2 + PLAYER_RADIUS;

      if (insideX && insideZ) return false;
    }
  }

  return true;
}

    // Simple trees to create a small explorable world
    function tree(x, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.35, 2, 6),
        material(0x67432d)
      );
      trunk.position.y = 1;
      group.add(trunk);

      for (let i = 0; i < 3; i++) {
        const crown = new THREE.Mesh(
          new THREE.ConeGeometry(1.35 - i * 0.22, 2.1, 7),
          material(i === 1 ? 0x238657 : 0x176c4a)
        );
        crown.position.y = 2.2 + i * 0.85;
        group.add(crown);
      }
      scene.add(group);

obstacles.push({
  type: "circle",
  x,
  z,
  r: 0.48 * scale
});
    }

    for (let i = 0; i < 65; i++) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const x = side * (6 + Math.random() * 35);
      const z = 20 - Math.random() * 100;
      tree(x, z, 0.7 + Math.random() * 0.8);
    }

    // A simple red shrine gate in the distance
    const red = material(0xc63f45);
    function beam(x, y, z, sx, sy, sz) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz), red
      );
      mesh.position.set(x, y, z);
      scene.add(mesh);
    }
    beam(-2.2, 2.0, -28, 0.35, 4, 0.35);
    beam( 2.2, 2.0, -28, 0.35, 4, 0.35);
    beam(0, 4.1, -28, 6.0, 0.4, 0.65);
    beam(0, 3.65, -28, 4.5, 0.25, 0.45);

    // Player: a simple placeholder character with three blue tails
    const player = new THREE.Group();
    scene.add(player);

    const blue = material(0x2678ff);
    const dark = material(0x17233f);
    const white = material(0xf0f6ff);

    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.42, 0.75, 3, 7), blue
    );
    body.position.y = 1.0;
    player.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.38, 10, 8), white
    );
    head.position.y = 1.85;
    player.add(head);

    for (let i = 0; i < 3; i++) {
      const tail = new THREE.Mesh(
        new THREE.ConeGeometry(0.19, 1.15, 6), blue
      );
      tail.rotation.x = -1.0;
      tail.rotation.z = (i - 1) * 0.55;
      tail.position.set((i - 1) * 0.34, 0.9, 0.55);
      player.add(tail);
    }

    const sword = new THREE.Mesh(
      new THREE.BoxGeometry(0.09, 0.9, 0.12),
      material(0x9beaff)
    );
    sword.position.set(0.52, 1.1, -0.1);
    sword.rotation.z = -0.35;
    player.add(sword);

    let yaw = 0;
    let camYaw = 0;
    let camPitch = 0.25;
    const keys = {};
    const input = { x: 0, y: 0 };

    addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
    });
    addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    const stick = document.querySelector("#stick");
    const knob = document.querySelector("#knob");
    let stickId = null;

    stick.addEventListener("pointerdown", e => {
      stickId = e.pointerId;
      stick.setPointerCapture(stickId);
      moveStick(e);
    });
    stick.addEventListener("pointermove", e => {
      if (e.pointerId === stickId) moveStick(e);
    });

    function moveStick(e) {
      const r = stick.getBoundingClientRect();
      let x = e.clientX - (r.left + r.width / 2);
      let y = e.clientY - (r.top + r.height / 2);
      const max = 38;
      const len = Math.hypot(x, y) || 1;
      if (len > max) { x *= max / len; y *= max / len; }
      input.x = x / max;
      input.y = y / max;
      knob.style.transform = `translate(${x}px, ${y}px)`;
    }

    function releaseStick(e) {
      if (e.pointerId !== stickId) return;
      stickId = null;
      input.x = input.y = 0;
      knob.style.transform = "";
    }
    stick.addEventListener("pointerup", releaseStick);
    stick.addEventListener("pointercancel", releaseStick);

    // Drag the right half of the screen to rotate the camera
    let lookId = null, lastX = 0, lastY = 0;
    renderer.domElement.addEventListener("pointerdown", e => {
      if (e.clientX < innerWidth * 0.38) return;
      lookId = e.pointerId;
      lastX = e.clientX;
      lastY = e.clientY;
      renderer.domElement.setPointerCapture(lookId);
    });
    renderer.domElement.addEventListener("pointermove", e => {
      if (e.pointerId !== lookId) return;
      camYaw -= (e.clientX - lastX) * 0.006;
      camPitch += (e.clientY - lastY) * 0.004;
      camPitch = THREE.MathUtils.clamp(camPitch, -0.15, 0.85);
      lastX = e.clientX;
      lastY = e.clientY;
    });
    function stopLook(e) {
      if (e.pointerId === lookId) lookId = null;
    }
    renderer.domElement.addEventListener("pointerup", stopLook);
    renderer.domElement.addEventListener("pointercancel", stopLook);

    // Demo attack animation; not connected to combat yet
    const message = document.querySelector("#message");
    let attackTime = 0;
    document.querySelector("#attack").addEventListener("pointerdown", e => {
      e.preventDefault();
      attackTime = 0.35;
      message.style.opacity = "1";
    });

    const clock = new THREE.Clock();
    const coords = document.querySelector("#coords");
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const move = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.04);

      let ix = input.x;
      let iz = input.y;
      if (keys.a || keys.arrowleft) ix -= 1;
      if (keys.d || keys.arrowright) ix += 1;
      if (keys.w || keys.arrowup) iz -= 1;
      if (keys.s || keys.arrowdown) iz += 1;

      camYaw += 0;
      forward.set(-Math.sin(camYaw), 0, -Math.cos(camYaw));
      right.set(Math.cos(camYaw), 0, -Math.sin(camYaw));
      move.set(0, 0, 0)
        .addScaledVector(right, ix)
        .addScaledVector(forward, -iz);

      if (move.lengthSq() > 1) move.normalize();

      const speed = 6 * dt;
      player.position.addScaledVector(move, speed);

      // Keep the character within the demo area
      player.position.x = THREE.MathUtils.clamp(player.position.x, -45, 45);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -85, 25);

      if (move.lengthSq() > 0.001) {
        yaw = Math.atan2(move.x, move.z);
        player.rotation.y = yaw;
      }

      if (attackTime > 0) {
        attackTime -= dt;
        sword.rotation.z = -0.35 - Math.sin(attackTime * 18) * 1.1;
        message.style.opacity = String(Math.min(1, attackTime * 4));
      } else {
        sword.rotation.z = -0.35;
        message.style.opacity = "0";
      }

      const target = player.position.clone();
      target.y += 1.1;

      const distance = 8;
      camera.position.set(
        target.x + Math.sin(camYaw) * distance * Math.cos(camPitch),
        target.y + 2.3 + Math.sin(camPitch) * distance,
        target.z + Math.cos(camYaw) * distance * Math.cos(camPitch)
      );
      camera.lookAt(target);

      coords.textContent =
        `Position: ${player.position.x.toFixed(1)}, ${player.position.z.toFixed(1)}`;

      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    });

    animate();
  </script>
</body>
</html>
